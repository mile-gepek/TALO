[package]
name = "talo"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.5"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gpui-component = "0.9.0"
gpui-kit = "0.9.0"
gtk = "0.18.2"
interprocess = "2.4.8"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "sync"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
triple_buffer = "9.0.1"
